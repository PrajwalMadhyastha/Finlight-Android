name: Android CI (Fast Checks)

# Explicitly limit permissions for security (principle of least privilege)
permissions:
  contents: read
  checks: write

# Runs on PRs targeting develop and main branches.
# For instrumented UI tests (slower, emulator-based), see:
#   .github/workflows/instrumented-tests.yml
# That workflow triggers on PRs to main, nightly, and manually.
on:
  pull_request:
    branches: [ "develop", "main" ]
  # Allow this workflow to be called by other workflows (e.g., instrumented-tests.yml)
  # as a prerequisite fast-check gate.
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Run Ktlint
      - name: Run Ktlint
        run: ./gradlew ktlintCheck

      # 5. Run unit tests (107 test files, ~2 min on ubuntu-latest)
      - name: Run unit tests
        env:
          TZ: 'Asia/Kolkata'
        run: ./gradlew testDebugUnitTest

      # 6. Build debug APK — confirms the project compiles cleanly
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 7. Upload raw test results (XML)
      - name: Upload raw test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14

      # 8. Publish test report
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          reporter: java-junit
          fail-on-error: true