name: Autonomous QA Agent

# Run on a daily schedule, manual dispatch, or pushes to main branch
on:
  push:
    branches:
      - main
  schedule:
    # Runs at 02:00 and 14:00 IST every day (20:30 and 08:30 UTC)
    - cron: '30 8,20 * * *'
  workflow_dispatch:
    inputs:
      goal:
        description: 'The high-level goal for the QA Agent'
        required: true
        default: 'random'

permissions:
  contents: read
  pull-requests: write # Required if we use a PR generation action later
  issues: write # Required to create bug issues from QA failures
  actions: read # Required to download artifacts from previous runs

jobs:
  agent-qa:
    name: Run AI QA Agent
    # ubuntu-latest supports KVM hardware acceleration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Previous Agent Memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the last 50 run IDs (regardless of success/failure so we don't forget bugs)
          RUN_IDS=$(gh run list --workflow=agent-qa.yml --limit 50 --json databaseId -q '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId')
          
          # First, try to find the new App Map format in any of the last 10 runs
          SUCCESS=0
          for ID in $RUN_IDS; do
            echo "Checking run $ID for qa-app-map..."
            if gh run download $ID -n qa-app-map 2>/dev/null; then
              echo "✅ Downloaded qa-app-map from run $ID"
              SUCCESS=1
              break
            fi
          done
          
          # If no App Map was found, fallback to the old agent memory format
          if [ $SUCCESS -eq 0 ]; then
            for ID in $RUN_IDS; do
              echo "Checking run $ID for qa-agent-memory..."
              if gh run download $ID -n qa-agent-memory 2>/dev/null; then
                echo "✅ Downloaded qa-agent-memory from run $ID"
                SUCCESS=1
                break
              fi
            done
          fi
          
          if [ $SUCCESS -eq 0 ]; then
            echo "⚠️ No successful previous runs with memory found in the last 10 runs."
          fi
        continue-on-error: true

      - name: Show Downloaded Memory
        run: |
          if [ -f "app_map.json" ]; then
            echo "✅ Successfully downloaded previous App Map:"
            cat app_map.json
          elif [ -f "agent_memory.txt" ]; then
            echo "⚠️ Found old agent_memory.txt. It will be migrated:"
            cat agent_memory.txt
          else
            echo "⚠️ No previous memory found (starting fresh)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Migrate Old Memory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Checking if memory needs migration..."
          python agent/migrate_memory.py

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Install APK, Run QA Agent
        uses: reactivecircus/android-emulator-runner@v2.37.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Installing App..."
            ./gradlew installDebug --no-daemon
            
            echo "Running AI Agent..."
            python -m agent.main --goal "${{ github.event.inputs.goal || 'random' }}" --max-steps 100 --api-level 34

      - name: Create GitHub Issue on Bug Found
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "new_bugs_found.txt" ]; then
            REPORT_FILE=$(find . -maxdepth 1 -name "qa-report-*.md" | head -n 1)
            if [ -f "$REPORT_FILE" ]; then
              ISSUE_TITLE="🤖 AI QA Agent Bug: ${{ github.event.inputs.goal || 'random' }}"
              # Check if an issue with this exact title already exists and is open
              EXISTING_ISSUE=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number -q '.[0].number')
              
              if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
                echo "An open issue already exists (#$EXISTING_ISSUE). Adding a comment instead of creating a duplicate."
                gh issue comment "$EXISTING_ISSUE" --body-file "$REPORT_FILE"
              else
                gh issue create \
                  --title "$ISSUE_TITLE" \
                  --body-file "$REPORT_FILE" \
                  --label "bug"
              fi
            else
              echo "No report file found to attach to the issue."
            fi
          else
            echo "No NEW bugs found. Skipping issue creation to prevent duplicates."
          fi

      - name: Upload QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report-*.md
          retention-days: 14

      - name: Upload App Map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-app-map
          path: app_map.json
          retention-days: 30

      - name: Display Report in Actions UI
        if: always()
        run: |
          if ls qa-report-*.md 1> /dev/null 2>&1; then
            cat qa-report-*.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "app_map.json" ]; then
            echo "## App Map JSON" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat app_map.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
